spring.application.name=sprintly
server.port=8080

# Datasource configuration (can be overridden by DATABASE_URL in production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sprintly}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate configurations
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Security configurations
sprintly.jwt.secret=${JWT_SECRET:8f7d983427deab456bc781d09e51c8a147e452cd32a67e9e8f1025aefb19cd52861aef42b321a590cb78fbc31a67a840e3408f623e809315264bce57849de78a}
# 15 minutes (900000 ms)
sprintly.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
# 7 days (604800000 ms)
sprintly.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# CORS Configuration
sprintly.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}

# SMTP Mail Server Configurations
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.from=noreply@sprintly.com

# Enable Async Thread Pool sizing
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100

# File Upload configurations (for avatar uploads or attachments)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
